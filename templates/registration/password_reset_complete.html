<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>body{font-family:'Poppins',sans-serif;}</style>
  </head>
  <body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl p-6">
      <h1 class="text-2xl font-semibold mb-2">Password updated</h1>
      <p class="text-sm text-white/80">Your password has been reset successfully.</p>
      <a href="{% url 'store:login' %}" class="inline-block mt-5 rounded-lg bg-emerald-500 text-slate-900 px-4 py-2 font-medium">Go to login</a>
    </div>
  </body>
</html>
