<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>body{font-family:'Poppins',sans-serif;}</style>
  </head>
  <body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl p-6">
      <h1 class="text-2xl font-semibold mb-2">Forgot password?</h1>
      <p class="text-sm text-white/75 mb-5">Enter your email and we'll send a reset link.</p>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm mb-1" for="id_email">Email</label>
          {{ form.email }}
        </div>
        <button class="w-full rounded-xl py-3 text-sm font-semibold bg-gradient-to-r from-emerald-400 via-green-500 to-lime-500 text-slate-900">Send reset link</button>
      </form>
      <p class="mt-4 text-sm text-white/75"><a href="{% url 'store:login' %}" class="text-emerald-200">Back to login</a></p>
    </div>
    <script>
      const emailInput = document.getElementById('id_email');
      if (emailInput) {
        emailInput.className = 'w-full rounded-xl bg-white/10 border border-white/30 px-4 py-3 text-sm placeholder:text-white/45 focus:outline-none focus:ring-2 focus:ring-emerald-300/70 focus:border-emerald-200/70 transition';
        emailInput.placeholder = 'you@example.com';
      }
    </script>
  </body>
</html>
