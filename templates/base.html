{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farmer E‑Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8yT9Tj0UjzB6+QcmGeXjr6UIz+YdX2Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body
    class="bg-gray-50 text-gray-800"
    data-theme="{{ buyer_theme|default:'light' }}"
    data-add-to-cart-url="{% url 'store:add_to_cart' %}"
    data-cart-url="{% url 'store:view_cart' %}"
    {% if user.is_authenticated %}
    data-wishlist-add-url="{% url 'store:add_to_wishlist' 0 %}" 
    data-wishlist-remove-url="{% url 'store:remove_from_wishlist' 0 %}"
    {% endif %}
  >
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }

      .dark body {
        background-color: #0f172a;
        color: #e2e8f0;
      }

      .dark .bg-white {
        background-color: #0b1220;
      }

      .dark .bg-gray-50 {
        background-color: #0f172a;
      }

      .dark .bg-gray-100 {
        background-color: #111827;
      }

      .dark .text-gray-900 {
        color: #f8fafc;
      }

      .dark .text-gray-700 {
        color: #d1d5db;
      }

      .dark .text-gray-600 {
        color: #cbd5f5;
      }

      .dark .text-gray-500 {
        color: #9ca3af;
      }

      .dark .border-gray-200 {
        border-color: #1f2937;
      }
    </style>
    {% include 'partials/nav.html' %}

    <main class="min-h-[70vh] container mx-auto px-4 py-8">
      {% block content %}{% endblock %}
    </main>

    <form method="post" class="hidden" aria-hidden="true">
      {% csrf_token %}
    </form>

    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    {% include 'partials/footer.html' %}

    <script src="{% static 'js/cart.js' %}"></script>
    <script>
      (function () {
        const theme = document.body.dataset.theme || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </body>
</html>
